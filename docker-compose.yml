version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: goburhan_postgres
    restart: always
    environment:
      POSTGRES_USER: goburhanadmin
      POSTGRES_PASSWORD: GB_P@ssw0rd_9824_Ent!
      POSTGRES_DB: goburhan_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: goburhan_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
